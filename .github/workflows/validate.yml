name: Validate SEA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python sea/scripts/check_skill.py sea
      - run: python -m unittest discover -s tests -v
      - name: Check portable edition freshness
        run: |
          python sea/scripts/check_skill.py sea --portable SEA.md
          git diff --exit-code -- SEA.md
